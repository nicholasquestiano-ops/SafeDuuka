<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SafeDuuka</title>
<style>
:root{--bg:#f6f5f0;--cd:#fff;--tx:#1c1c1a;--mu:#6b6a64;--ac:#1b7a3d;--ac2:#e3f3e8;--bd:#e2e0d8;--rd:#c0392b;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151513;--cd:#212120;--tx:#f0efe9;--mu:#9d9b92;--ac:#4cc27a;--ac2:#1d3326;--bd:#34332f;--rd:#ef6b5c;--on:#0d1a12;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151513;--cd:#212120;--tx:#f0efe9;--mu:#9d9b92;--ac:#4cc27a;--ac2:#1d3326;--bd:#34332f;--rd:#ef6b5c;--on:#0d1a12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#m{padding:14px 12px 230px;max-width:640px;margin:auto}
h2{margin:0 0 4px;font-size:23px}h3{margin:0 0 8px}p{color:var(--mu);margin:4px 0 12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,select{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}button{font:inherit;cursor:pointer}
.big{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font-weight:700;font-size:17px}
.g{padding:15px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font-weight:600}
.sm{padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac2);color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{position:relative;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px}
.it:active{background:var(--ac2)}.em{font-size:34px;line-height:46px}.it img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.it b{font-size:13px;text-align:center;line-height:1.15}.it small{color:var(--mu)}
.bg{position:absolute;top:6px;right:6px;background:var(--ac);color:var(--on);border-radius:99px;min-width:24px;padding:1px 7px;font-style:normal;font-weight:700;font-size:13px;text-align:center}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t small{display:block;color:var(--mu)}.li .em{font-size:26px;line-height:36px}.li img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.low{color:var(--rd);font-weight:700}.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}.kv.b{font-weight:800;font-size:18px}
#cart{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:2px solid var(--ac);padding:10px 12px;display:none;max-height:46vh;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
#cart .in{max-width:640px;margin:auto}.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 8px;font-size:12px;font-weight:600}nav button span{display:block;font-size:22px}nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 18px;border-radius:99px;font-weight:700;z-index:30;display:none;max-width:90%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:6px 0;border-radius:8px;font-size:14px;min-height:44px}.cal .h{color:var(--mu);font-size:12px;min-height:0}
.cal .d{background:var(--bg)}.cal .y{background:var(--ac2);color:var(--ac);font-weight:700}.cal .n{outline:2px solid var(--ac)}.cal small{display:block;font-size:10px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}.bars i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}
.err{border-color:var(--rd)}
.dot{display:block;width:10px;height:10px;border-radius:50%;margin:3px auto 0}.r{background:#d64545}.o{background:#f0932b}.gr{background:#2ea04f}
.cal .y{background:var(--bg);color:var(--tx);font-weight:700}
.av{flex:0 0 64px;width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:28px}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;margin:0;border-radius:0}
#lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 24px}
.ban{background:#fff3d6;color:#6b4a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
:root{--ac:#17803d;--ac2:#e7f4ec;--bg:#f4f5f2;--bd:#e4e6e0;--sh:0 1px 2px rgba(20,30,20,.06),0 6px 18px rgba(20,30,20,.05)}
body{font:15px/1.45 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.005em}
h2{font-size:22px;letter-spacing:-.02em;font-weight:700}h3{font-size:15px;font-weight:650}
.card{border-radius:18px;box-shadow:var(--sh);padding:16px}
button{transition:transform .08s,background .15s}button:active{transform:scale(.97)}
.big{min-height:50px;border-radius:14px;font-size:16px;font-weight:650;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 8px rgba(23,128,61,.25)}
.big.alt{background:var(--ac2);color:var(--ac);box-shadow:none}
.g{min-height:48px;border-radius:14px;font-weight:600}
.sm{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;background:var(--ac2);border:0}
input,select{border-radius:12px;padding:13px 14px;font-size:16px}input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
.it{border-radius:16px;box-shadow:var(--sh);min-height:122px;padding:12px 6px 10px;gap:4px}
.it .em,.li .em{background:var(--ac2);border-radius:14px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
.li .em{width:40px;height:40px;font-size:22px;border-radius:12px}.it img{width:52px;height:52px}
.it b{font-weight:600}.it small{font-weight:700;color:var(--ac)}
nav{box-shadow:0 -8px 24px rgba(0,0,0,.05)}nav button{font-size:11px;font-weight:600;letter-spacing:.02em}nav button span{display:none}
nav svg{display:block;margin:0 auto 3px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh{border-radius:24px 24px 0 0}#cart{border-radius:20px 20px 0 0;border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.chips button{flex:1;min-width:64px;padding:11px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-weight:600}
.chg{padding:14px;border-radius:14px;background:var(--bg);text-align:center;margin-bottom:12px;color:var(--mu)}.chg.ok{background:var(--ac2);color:var(--ac);font-size:18px}
.brand{display:inline-flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-.02em;font-size:18px;color:var(--ac)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tx);margin:4px 0 12px}.chk input{width:20px;height:20px;margin:1px 0 0;flex:0 0 20px;accent-color:var(--ac)}
</style></head><body>
<div id="m"></div><div id="cart"></div><div id="toast"></div><div id='lock'></div>
<nav><button data-t="sell" onclick="T('sell')"><span>🛒</span>Sell</button><button data-t="stock" onclick="T('stock')"><span>📦</span>Stock</button><button data-t="day" onclick="T('day')"><span>📅</span>Day</button><button data-t="cat" onclick="T('cat')"><span>🏷️</span>Items</button><button data-t="me" onclick="T('me')"><span>👤</span>Owner</button></nav>
<script>const API_BASE=window.API_URL||location.origin; // SafeDuuka API: same server that hosts this page</script>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString("en-US"),PAY={cash:"Cash",momo:"MTN MoMo",airtel:"Airtel Money"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEED=[["Soda 500ml","🥤",1500,1200,12],["Soda 300ml","🥤",1000,800,24],["Water 500ml","💧",1000,700,24],["Juice","🧃",2000,1600,12],["Beer bottle","🍺",4000,3300,12],["Cake slice","🍰",1000,700],["Bun","🥐",500,350],["Chapati","🫓",500,300],["Sweets","🍬",100,60,100],["Biscuits","🍪",500,350,24],["Sanitary pads","🌸",3000,2400,10],["Toilet paper","🧻",1000,800,10],["Macaroni","🍝",3000,2500,20],["Noodles","🍜",1000,800,40],["Sugar","🧂",4500,4000,50,1],["Salt","🧂",1000,700,20],["Rice","🍚",5000,4300,50,1],["Posho","🌽",3000,2500,50,1],["Beans","🫘",4500,3800,50,1],["Cooking oil 1L","🛢️",9000,8000,12],["Bread","🍞",4500,4000],["Eggs","🥚",500,400,30],["Milk 500ml","🥛",1500,1200,20],["Tea leaves","☕",500,350],["Soap","🧼",2500,2000,12],["Matches","🔥",200,150,10],["Candle","🕯️",500,350,10],["Toothpaste","🪥",3000,2400,12],["Vaseline","🧴",3000,2400,12],["Exercise book","📓",1000,700,12]];
let S=null;try{S=JSON.parse(localStorage.getItem("safe1"))}catch(e){}
if(!S){S={shops:{},agents:{},cur:null};try{const o=JSON.parse(localStorage.getItem("duuka2"));if(o&&o.prof&&o.prof.pin)S.shops[o.prof.phone]=o}catch(e){}}
let D=null;
const newShop=()=>({items:SEED.slice(0,0).map((x,i)=>({id:i+1,n:x[0],e:x[1],p:x[2],b:x[3],pk:x[4]||1,m:x[5]||0,s:12})),sales:[],day:null,days:[],prof:{shop:"",owner:"",phone:"",loc:""}});if(S.cur&&S.cur.shop&&S.shops[S.cur.shop])D=S.shops[S.cur.shop];
let tab="sell",cart={},q="",cm=new Date();
const save0=()=>{try{localStorage.setItem("safe1",JSON.stringify(S))}catch(e){toast("Storage full: use smaller photos")}};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2000)}
function T(t){tab=t;R()}
const find=id=>D.items.find(i=>i.id==id),pr=(i,o)=>i.m?Math.round(i.p*o):i.p,u=i=>i.m?" kg":"";
const fl=o=>o==.25?"¼ kg":o==.5?"½ kg":o+" kg",r2=n=>Math.round(n*100)/100;
const pic=i=>i.img?`<img src="${i.img}" alt="">`:`<span class="em">${i.e||"🛒"}</span>`;
const tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),dt=t=>new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const lname=l=>(find(l.id)?.n||l.n||"Deleted item")+(l.l?" ("+l.l+")":"");
const shop=()=>D.prof.shop||"your shop";
function R(){if(!S.cur||(!D&&S.cur.role!='agent'))return welcome();if(!D)return agentHome();if(exp()){lockUI('pay');$('#lock').firstChild.insertAdjacentHTML('beforeend',`<button class='g' style='width:100%;margin-top:8px' onclick='${S.cur.role=='agent'?'backToAgent()':'signOut()'}'>${S.cur.role=='agent'?'Back to my shops':'Sign out'}</button>`);return}$('#lock').style.display='none';if((tab=='stock'||tab=='cat')&&unlocked())lastAdm=Date.now();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
$("#m").innerHTML=hdr()+banner()+({sell:vSell,stock:vStock,day:vDay,cat:vCat,me:vMe,debt:vDebt})[tab]();if((tab=="sell"||tab=="debt")&&D.day)grid();cartUI();scrollTo(0,0)}
function vSell(){if(!D.day){const h=new Date().getHours(),g=h<12?"Good morning":h<17?"Good afternoon":"Good evening",L=D.days[0];
return `<div class="card"><h2>${g}${D.prof.owner?", "+esc(D.prof.owner):""}! 👋</h2><p>Let’s open ${esc(shop())} for business. <b>Step 1:</b> count the money in your drawer and enter it below. You cannot start selling without it.</p>${L?`<p>Last time you closed with UGX ${fmt(L.cc)} in the drawer.</p>`:""}<label>Opening cash in drawer (UGX)</label><input id="oc" type="number" inputmode="numeric" placeholder="e.g. 20000" value="${L?L.cc:""}"><button class="big" onclick="startDay()">Start day</button></div>`}
return `<h2>Sell</h2><p>Tap what the customer wants, then choose how they paid.</p><input id="s" placeholder="🔍 Search item…" value="${esc(q)}" oninput="q=this.value;grid()"><div id="grid" class="grid"></div>${exCard()}`}
function startDay(){const v=$("#oc").value;if(v===""||+v<0){$("#oc").classList.add("err");return toast("Enter the opening cash first")}D.day={id:Date.now(),open:Date.now(),cash:+v};save();R();toast("Day started. Good luck!")}
const cnt=id=>Object.values(cart).filter(c=>c.id==id).reduce((a,c)=>a+c.q,0);
function grid(){const L=D.items.filter(i=>i.n.toLowerCase().includes(q.toLowerCase()));
$("#grid").innerHTML=L.map(i=>`<button class="it" onclick="add(${i.id})">${pic(i)}<b>${esc(i.n)}</b><small>${fmt(i.p)}${i.m?" / kg":""}</small>${cnt(i.id)?`<i class="bg">${cnt(i.id)}</i>`:""}</button>`).join("")||"<p>Not found. Add it in Items.</p>"}
function add(id){const i=find(id);if(!i.m)return addL(id,1);const o=document.createElement("div");o.className="ov";
o.innerHTML=`<div class="sh"><h3>${esc(i.n)}: how much?</h3>${[.25,.5,1,2].map(x=>`<button class="big" style="margin-bottom:8px" data-o="${x}">${fl(x)} · UGX ${fmt(pr(i,x))}</button>`).join("")}<button class="g" style="width:100%" id="x">Cancel</button></div>`;document.body.appendChild(o);
o.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{o.remove();addL(id,+b.dataset.o)});o.querySelector("#x").onclick=()=>o.remove()}
function addL(id,o){const k=id+"_"+o;cart[k]=cart[k]||{id,o,q:0};cart[k].q++;grid();cartUI()}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];grid();cartUI()}
function cartUI(){const e=$("#cart"),ks=Object.keys(cart);if(!ks.length||tab!="sell"||!D.day){e.style.display="none";return}
let tot=0;const L=ks.map(k=>{const c=cart[k],i=find(c.id),p=pr(i,c.o)*c.q;tot+=p;return `<div class="li"><div class="t">${esc(i.n)}${i.m?" · "+fl(c.o):""}<small>${fmt(p)}</small></div><div class="q"><button onclick="chg('${k}',-1)">−</button><b>${c.q}</b><button onclick="chg('${k}',1)">+</button></div></div>`}).join("");
e.innerHTML=`<div class="in">${L}<div class="kv b"><span>Total</span><span>UGX ${fmt(tot)}</span></div><p style="margin:8px 0 6px">Paid by:</p><div class="row"><button class="big" onclick="sell('cash')">Cash</button><button class="big" onclick="sell('momo')">MoMo</button><button class="big" onclick="sell('airtel')">Airtel</button></div><button class="g" style="width:100%;margin-top:8px" onclick="cart={};R()">Clear</button></div>`;e.style.display="block"}
function sell(pay){let tot=0;const lines=Object.values(cart).map(c=>{const i=find(c.id);i.s=r2(i.s-c.o*c.q);tot+=pr(i,c.o)*c.q;return{id:c.id,l:i.m?fl(c.o):"",q:c.q,p:pr(i,c.o),c:Math.round(i.b*c.o)}});
D.sales.push({id:Date.now(),no:D.sales.length+1,t:Date.now(),day:D.day.id,lines,pay,tot});cart={};save();R();toast("Sold UGX "+fmt(tot)+" · "+PAY[pay])}
function vStock(){return chip()+`<h2>Stock</h2><p>See what is in the shop. When goods arrive, tap <b>+ Add</b> and say whether they came as single units or as packs.</p><div class="card">${D.items.map(i=>`<div class="li">${pic(i)}<div class="t">${esc(i.n)}<small class="${i.s<=3?"low":""}">${r2(i.s)}${u(i)} in stock${i.s<=3?" · low":""}</small></div><button class="sm" onclick="stockIn(${i.id})">+ Add</button><button class="g" style="padding:9px 12px" onclick="lost(${i.id})">−</button></div>`).join("")}</div>`}
function stockIn(id){gate(()=>stockIn2(id))}
function stockIn2(id){const i=find(id),w=i.m?"kg":"units";ask("Add stock: "+i.n,[{k:"how",l:"Goods came as",t:"select",o:["Single "+w,"Packs (carton, sack, packet)"]},{k:"q",l:"How many? (number of "+w+" or packs)",t:"number"},{k:"pk",l:"Units in one pack (ignore if single)",t:"number",v:i.pk||1},{k:"b",l:"Price paid per pack or per single (UGX)",t:"number"}],v=>{const pk=v.how=="1"?(+v.pk||1):1,n=(+v.q||0)*pk;if(!n)return toast("Enter how many came");i.s=r2(i.s+n);if(+v.b)i.b=Math.round(+v.b/pk);if(v.how=="1")i.pk=pk;save();R();toast("Added "+n+" "+w+" to stock")})}
function lost(id){gate(()=>lost2(id))}
function lost2(id){const i=find(id);ask("Remove from stock: "+i.n,[{k:"q",l:"Amount spoiled, damaged or lost",t:"number"}],v=>{i.s=Math.max(0,r2(i.s-(+v.q||0)));save();R()})}
const todaySales=()=>D.day?D.sales.filter(s=>s.day==D.day.id&&!s.void):[];
function agg(S){const n={};S.forEach(s=>s.lines.forEach(l=>{const k=l.id+l.l,o=n[k]||(n[k]={n:lname(l),q:0,a:0,pf:0});o.q+=l.q;o.a+=l.p*l.q;o.pf+=(l.p-l.c)*l.q}));return Object.values(n).sort((a,b)=>b.a-a.a)}
function vDay(){let h="";if(!D.day)h=`<div class="card"><h2>Day</h2><p>No day is open. Go to <b>Sell</b> to start the day with your opening cash.</p><button class="big" onclick="T('sell')">Start day</button></div>`;
else{const S=todaySales(),tot=S.reduce((a,s)=>a+s.tot,0),all=D.sales.filter(s=>s.day==D.day.id).reverse();
h=`<div class="card"><h2>Today, ${dt(D.day.open)}</h2><p>Opened ${tm(D.day.open)}. When the shop closes, count your cash and close the day.</p><div class="kv b"><span>Sales so far</span><span>UGX ${fmt(tot)}</span></div><div class="kv"><span>Number of sales</span><span>${S.length}</span></div><button class="big" style="margin-top:12px" onclick="closeDay()">Close day and see report</button></div>
<div class="card"><h3>Receipts</h3>${all.map(s=>`<div class="li" style="${s.void?"opacity:.45":""}"><div class="t">${s.lines.map(l=>l.q+"× "+esc(lname(l))).join(", ")}<small>${tm(s.t)} · ${PAY[s.pay]}${s.void?" · VOID":""}</small></div><b>${fmt(s.tot)}</b><button class="sm" onclick="receipt(${s.id})">Receipt</button>${s.void?"":`<button class="g" style="padding:8px 10px" onclick="voidS(${s.id})">Void</button>`}</div>`).join("")||"<p>No sales yet.</p>"}</div>`}
return h+cal()}

let c=["S","M","T","W","T","F","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(f);

 try{await api('/api/me/pin',{pin:v.a});D.prof.pin=v.a;save();toast('PIN changed')}catch(e){toast(e.message||'Could not change the PIN',4000)}}))}
function hdr(){const a=S.cur&&S.cur.role=='agent';return `<div class='row' style='margin-bottom:12px'><div style='flex:0 0 auto'>${LOGO?`<img src='${LOGO}' alt='' style='height:26px'>`:`<span class='brand'>${MARK}SafeDuuka</span>`}</div><span style='color:var(--mu);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500'>${esc(D.prof.shop||'')}<br><small id='sst'>${myStl()}</small></span>${a?`<button class='sm' style='flex:0 0 auto' onclick='backToAgent()'>Shops</button>`:''}</div>`}

/* ----- Forgot your PIN (email code, or ask for help) ----- */
const FERR={no_account:'No shop found with that phone number.',no_email:'This shop has no email saved. Tap \u201cAsk for help\u201d below.',bad_code:'That code is not correct.',expired:'That code has expired. Go back and ask for a new one.',too_many:'Too many wrong tries. Go back and ask for a new code.',email_not_configured:'Email codes are not switched on yet. Tap \u201cAsk for help\u201d.',email_failed:'The email could not be sent. Tap \u201cAsk for help\u201d.',failed:'Something went wrong. Check your internet and try again.'};
function ferr(m,neutral){const e=$('#fe');if(e)e.innerHTML=m?`<div class='ban' style='${neutral?'':'background:#fde8e6;color:#8a1c12'}'>${esc(m)}</div>`:''}
function forgot(p){wrap(`<h2>Forgot your PIN?</h2><p>We can email a 6-digit code to the email address saved on your shop.</p><div class='card'><label>Phone number</label><input id='fp' type='tel' value='${esc(p||S.last||'')}'><div id='fe'></div><button class='big' onclick='fSend()'>Email me a code</button></div><button class='g' style='width:100%;margin-bottom:8px' onclick='fHelp()'>I have no email. Ask for help</button><button class='g' style='width:100%' onclick='welcome()'>Back</button>`)}
async function fSend(){const p=$('#fp').value.trim();if(!/^0\d{9}$/.test(p))return ferr('Enter your phone number like 0772123456');if(!navigator.onLine)return ferr('You need internet for this.');ferr('Sending\u2026',1);
 try{const j=await api('/api/pin/forgot',{phone:p});forgot2(p,j.to)}catch(e){ferr(FERR[e.message]||FERR.failed)}}
function forgot2(p,to){wrap(`<h2>Check your email</h2><p>We sent a 6-digit code to ${esc(to)}. It works for 15 minutes.</p><div class='card'><label>6-digit code</label><input id='fc' inputmode='numeric' maxlength='6'><label>New PIN (4 to 14 digits)</label><input id='fn' type='password' inputmode='numeric'><label>Repeat the new PIN</label><input id='fn2' type='password' inputmode='numeric'><div id='fe'></div><button class='big' onclick='fConfirm(&quot;${p}&quot;)'>Reset my PIN</button></div><button class='g' style='width:100%' onclick='forgot(&quot;${p}&quot;)'>Back</button>`)}
async function fConfirm(p){const c=$('#fc').value.trim(),a=$('#fn').value.trim(),b=$('#fn2').value.trim();if(!/^\d{6}$/.test(c))return ferr('Enter the 6-digit code from the email');if(!/^\d{4,14}$/.test(a))return ferr('PIN must be 4 to 14 digits');if(a!==b)return ferr('The two PINs do not match');ferr('Saving\u2026',1);
 try{await api('/api/pin/forgot/confirm',{phone:p,code:c,pin:a});S.last=p;if(S.shops[p])S.shops[p].prof.pin=a;save0();welcome();toast('PIN changed. Sign in with your new PIN.',5000)}catch(e){ferr(FERR[e.message]||FERR.failed)}}
function fHelp(){wrap(`<h2>Ask for help</h2><p>Someone from SafeDuuka will contact you to confirm it is you, then reset your PIN.${SUPPORT?` You can also call or WhatsApp ${esc(SUPPORT)}.`:''}${SUPPORT_EMAIL?` Or email ${esc(SUPPORT_EMAIL)}.`:''}</p><div class='card'><label>Your phone number</label><input id='hp' type='tel' value='${esc(S.last||'')}'><label>Shop name</label><input id='hs'><div id='fe'></div><button class='big' onclick='fReq()'>Send request</button></div><button class='g' style='width:100%' onclick='welcome()'>Back</button>`)}
async function fReq(){const p=$('#hp').value.trim(),s=$('#hs').value.trim();if(!/^0\d{9}$/.test(p))return ferr('Enter your phone number like 0772123456');if(!navigator.onLine)return ferr('You need internet to send a request.'+(SUPPORT?' Call '+SUPPORT+' instead.':''));
 try{await api('/api/support/request',{phone:p,note:s})}catch(e){return ferr('Could not send the request. Please try again.')}
 wrap(`<h2>Request sent</h2><p>We will contact you on ${esc(p)}.</p><button class='big' onclick='welcome()'>Back to sign in</button>`)}
window.addEventListener('online',()=>{cSync='idle';if(D&&D.dirty)pushNow()});window.addEventListener('offline',()=>setSt('offline'));

R();
</script></body></html>
